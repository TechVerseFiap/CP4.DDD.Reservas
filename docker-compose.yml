services:
  oracle:
    image: gvenzl/oracle-xe:21-slim-faststart
    container_name: reservas-oracle
    environment:
      ORACLE_PASSWORD: ${ORACLE_SYS_PASSWORD:?Set ORACLE_SYS_PASSWORD in .env}
      APP_USER: ${ORACLE_DB_USERNAME:-RESERVAS}
      APP_USER_PASSWORD: ${ORACLE_DB_PASSWORD:?Set ORACLE_DB_PASSWORD in .env}
    ports:
      - "${ORACLE_PORT:-1521}:1521"
    volumes:
      - oracle-data:/opt/oracle/oradata
    healthcheck:
      test: ["CMD", "healthcheck.sh"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: reservas-api
    environment:
      SPRING_PROFILES_ACTIVE: prod
      ORACLE_DB_URL: jdbc:oracle:thin:@oracle:1521/XEPDB1
      ORACLE_DB_USERNAME: ${ORACLE_DB_USERNAME:-RESERVAS}
      ORACLE_DB_PASSWORD: ${ORACLE_DB_PASSWORD:?Set ORACLE_DB_PASSWORD in .env}
    ports:
      - "${API_PORT:-8080}:8080"
    depends_on:
      oracle:
        condition: service_healthy

volumes:
  oracle-data:
